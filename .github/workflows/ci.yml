name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: "postgresql://amr_hub:amr_hub_ci@localhost:5432/amr_hub?schema=public"
      DIRECT_URL: "postgresql://amr_hub:amr_hub_ci@localhost:5432/amr_hub?schema=public"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      BETTER_AUTH_SECRET: "ci-only-authentication-secret-at-least-32-characters"
      AUTH_BOOTSTRAP_TOKEN: "ci-only-owner-bootstrap-token-at-least-32-characters"
      RESEND_API_KEY: "re_ci_placeholder_never_sends"
      EMAIL_FROM: "AMR Hub CI <ci@example.com>"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: amr_hub
          POSTGRES_USER: amr_hub
          POSTGRES_PASSWORD: amr_hub_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U amr_hub -d amr_hub"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev

      - name: Generate database client
        run: npm run db:generate

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build
